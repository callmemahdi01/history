<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>چک‌لیست شرح حال و معاینه</title>
<style>
:root{
  --ink:#1c2b2a;
  --paper:#f6f3ec;
  --line:#c9c2b2;
  --accent:#2f6f62;
  --accent-soft:#e4ede9;
  --done:#8a8578;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Vazirmatn","Tahoma",sans-serif;
  line-height:1.7;
}
header{
  position:sticky;top:0;z-index:5;
  background:var(--paper);
  border-bottom:2px solid var(--ink);
  padding:14px 20px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
}
header h1{font-size:18px;margin:0;}
header .progress{font-size:13px;color:var(--done);}
button.reset{
  background:none;border:1px solid var(--line);border-radius:6px;
  padding:6px 12px;font-size:12px;cursor:pointer;color:var(--ink);
}
main{max-width:760px;margin:0 auto;padding:16px 16px 60px;}
.section{
  border:1px solid var(--line);
  border-radius:8px;
  margin-bottom:10px;
  overflow:hidden;
  background:#fffdf9;
}
.section > summary{
  list-style:none;cursor:pointer;
  padding:12px 14px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  font-weight:700;
  border-right:4px solid var(--accent);
  background:var(--accent-soft);
}
.section > summary::-webkit-details-marker{display:none;}
.section > summary .count{font-size:12px;font-weight:400;color:var(--done);}
.section .body{padding:10px 14px 14px;}
.item{
  display:flex;align-items:flex-start;gap:8px;
  padding:7px 4px;
  border-bottom:1px dashed var(--line);
  font-size:14px;
}
.item:last-child{border-bottom:none;}
.item input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex-shrink:0;}
.item label{cursor:pointer;flex:1;}
.item.checked label{color:var(--done);text-decoration:line-through;}
.note{
  font-size:12.5px;color:var(--done);
  margin:2px 0 8px;
}
.badge{
  display:inline-block;font-size:11px;background:var(--ink);color:var(--paper);
  border-radius:4px;padding:1px 6px;margin-inline-start:6px;
}
</style>
</head>
<body>

<header>
  <h1>چک‌لیست شرح حال و معاینه بدنی</h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="progress" id="progress"></span>
    <button class="reset" onclick="resetAll()">پاک کردن تیک‌ها</button>
  </div>
</header>

<main id="main"></main>

const main = document.getElementById("main");
let idCounter = 0;

data.forEach(([title, note, items], si) => {
  const section = document.createElement("details");
  section.className = "section";
  section.open = si === 0;

  const summary = document.createElement("summary");
  summary.innerHTML = `<span>${title}</span><span class="count" data-section="${si}"></span>`;
  section.appendChild(summary);

  const body = document.createElement("div");
  body.className = "body";
  if (note) {
    const n = document.createElement("div");
    n.className = "note";
    n.textContent = note;
    body.appendChild(n);
  }

  items.forEach(text => {
    const id = "chk" + (idCounter++);
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `<input type="checkbox" id="${id}"><label for="${id}">${text}</label>`;
    body.appendChild(row);
  });

  section.appendChild(body);
  main.appendChild(section);
});

function loadState(){
  try{ return JSON.parse(localStorage.getItem("hx-checklist")||"{}"); }catch(e){ return {}; }
}
function saveState(state){
  localStorage.setItem("hx-checklist", JSON.stringify(state));
}

function applyState(){
  const state = loadState();
  document.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.checked = !!state[cb.id];
    cb.parentElement.classList.toggle("checked", cb.checked);
  });
  updateCounts();
}

function updateCounts(){
  let totalChecked = 0, totalAll = 0;
  document.querySelectorAll(".section").forEach((section, si)=>{
    const boxes = section.querySelectorAll('input[type=checkbox]');
    const checked = [...boxes].filter(b=>b.checked).length;
    totalChecked += checked; totalAll += boxes.length;
    const countEl = section.querySelector(`.count[data-section="${si}"]`);
    if(countEl) countEl.textContent = `${checked}/${boxes.length}`;
  });
  document.getElementById("progress").textContent = `${totalChecked} از ${totalAll} مورد`;
}

document.addEventListener("change", e=>{
  if(e.target.matches('input[type=checkbox]')){
    e.target.parentElement.classList.toggle("checked", e.target.checked);
    const state = loadState();
    state[e.target.id] = e.target.checked;
    saveState(state);
    updateCounts();
  }
});

function resetAll(){
  localStorage.removeItem("hx-checklist");
  applyState();
}

applyState();
</script>
